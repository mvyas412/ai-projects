name: MM-RAG Phase 3/4 CI

on:
  push:
    branches:
      - "phase-3/mm-rag-async-ingestion"
      - "phase-4/mm-rag-governance"
    paths:
      - "mm-rag-full-stack-genai-bootcamp-3.0/**"
      - ".github/workflows/mm-rag-phase3-ci.yml"
  pull_request:
    paths:
      - "mm-rag-full-stack-genai-bootcamp-3.0/**"
      - ".github/workflows/mm-rag-phase3-ci.yml"

concurrency:
  group: mm-rag-phase3-4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mm-rag-full-stack-genai-bootcamp-3.0
    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: mm_rag_phase3
          POSTGRES_USER: mm_rag
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mm_rag -d mm_rag_phase3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
      rabbitmq:
        image: rabbitmq:4.2.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: mmrag-ci
          RABBITMQ_DEFAULT_PASS: ci-only-password
          RABBITMQ_DEFAULT_VHOST: mm_rag_phase3
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://mm_rag:ci-only-password@127.0.0.1:5432/mm_rag_phase3
      QDRANT_URL: http://127.0.0.1:6333
      RABBITMQ_URL: amqp://mmrag-ci:ci-only-password@127.0.0.1:5672/mm_rag_phase3
      MM_RAG_RUN_INTEGRATION_TESTS: "1"
      MM_RAG_RUN_RABBITMQ_INTEGRATION_TESTS: "1"
      LOCAL_STORAGE_ROOT: /tmp/mm-rag-phase3-ci-storage
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.13"
          enable-cache: true
          cache-dependency-glob: mm-rag-full-stack-genai-bootcamp-3.0/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked

      - name: Verify lock file
        run: uv lock --check

      - name: Lint
        run: uv run ruff check backend frontend migrations tests

      - name: Type check
        run: uv run mypy backend frontend tests/backend

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Verify migration head
        run: test "$(uv run alembic current | tail -1)" = "20260830_0008 (head)"

      - name: Detect schema drift
        run: uv run alembic check

      - name: Run tests with coverage
        run: >-
          uv run pytest
          --cov=backend.app
          --cov=frontend
          --cov-report=term-missing
          --cov-fail-under=70

      - name: Check working tree
        run: git diff --check
