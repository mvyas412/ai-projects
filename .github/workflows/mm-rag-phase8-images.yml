name: MM-RAG Phase 8 images

on:
  pull_request:
    paths:
      - "mm-rag-full-stack-genai-bootcamp-3.0/Dockerfile"
      - "mm-rag-full-stack-genai-bootcamp-3.0/deploy/oci/**"
      - "mm-rag-full-stack-genai-bootcamp-3.0/frontend-next/**"
      - ".github/workflows/mm-rag-phase8-images.yml"
  workflow_dispatch:

concurrency:
  group: mm-rag-phase8-images-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  validate-terraform-and-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mm-rag-full-stack-genai-bootcamp-3.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject high or critical OCI configuration findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: mm-rag-full-stack-genai-bootcamp-3.0/deploy/oci
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Reject detected secrets in tracked Phase 8 sources
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: mm-rag-full-stack-genai-bootcamp-3.0
          scanners: secret
          exit-code: "1"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.2

      - name: Validate plan-only OCI module
        working-directory: mm-rag-full-stack-genai-bootcamp-3.0/deploy/oci/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mm-rag-full-stack-genai-bootcamp-3.0/frontend-next/package-lock.json

      - name: Validate Next.js candidate
        working-directory: mm-rag-full-stack-genai-bootcamp-3.0/frontend-next
        run: |
          npm ci
          npm audit
          npm test
          npm run typecheck
          npm run build

  validate-platform-image:
    name: validate-platform-image (${{ matrix.component }}, ${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: app
            architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - component: app
            architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - component: next
            architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - component: next
            architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build application image without publishing
        if: matrix.component == 'app'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: mm-rag-full-stack-genai-bootcamp-3.0
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            PREFETCH_PHASE5_MODELS=0
          cache-from: type=gha,scope=phase8-app-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=phase8-app-${{ matrix.architecture }}

      - name: Build Next.js candidate without publishing
        if: matrix.component == 'next'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: mm-rag-full-stack-genai-bootcamp-3.0/frontend-next
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=phase8-next-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=phase8-next-${{ matrix.architecture }}

  validate-multi-platform-image:
    needs: validate-platform-image
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Require every native architecture build
        env:
          MATRIX_RESULT: ${{ needs.validate-platform-image.result }}
        run: test "${MATRIX_RESULT}" = "success"

  validate-native-image-security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build native app image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: mm-rag-full-stack-genai-bootcamp-3.0
          load: true
          tags: mm-rag-phase8:scan
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            PREFETCH_PHASE5_MODELS=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Reject fixable app-image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mm-rag-phase8:scan
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build native Next.js candidate image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: mm-rag-full-stack-genai-bootcamp-3.0/frontend-next
          load: true
          tags: mm-rag-phase8-next:scan
          cache-from: type=gha,scope=phase8-next
          cache-to: type=gha,mode=max,scope=phase8-next

      - name: Reject fixable candidate-image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mm-rag-phase8-next:scan
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish-approved-image:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - validate-terraform-and-candidate
      - validate-multi-platform-image
      - validate-native-image-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: phase8-learning
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: mm-rag-full-stack-genai-bootcamp-3.0
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mm-rag-phase8:${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            PREFETCH_PHASE5_MODELS=0
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Reject fixable high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/mm-rag-phase8@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mm-rag-phase8
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"
