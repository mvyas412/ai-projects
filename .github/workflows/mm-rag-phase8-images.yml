name: MM-RAG Phase 8 images

on:
  pull_request:
    paths:
      - "mm-rag-full-stack-genai-bootcamp-3.0/Dockerfile"
      - "mm-rag-full-stack-genai-bootcamp-3.0/deploy/oci/**"
      - ".github/workflows/mm-rag-phase8-images.yml"
  workflow_dispatch:

concurrency:
  group: mm-rag-phase8-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-multi-platform-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build AMD64 and ARM64 images without publishing
        uses: docker/build-push-action@v7
        with:
          context: mm-rag-full-stack-genai-bootcamp-3.0
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            PREFETCH_PHASE5_MODELS=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-approved-image:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-multi-platform-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: phase8-learning
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: mm-rag-full-stack-genai-bootcamp-3.0
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mm-rag-phase8:${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            PREFETCH_PHASE5_MODELS=0
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Reject fixable high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/mm-rag-phase8@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign the published digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mm-rag-phase8
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"
