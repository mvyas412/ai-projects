[project]
name = "mm-rag-production"
version = "2.0.0"
description = "Production-oriented multimodal retrieval-augmented generation application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "langchain-core==1.5.3",
    "langchain-openai>=1.4,<2",
    "langchain-qdrant>=1.1,<2",
    "langchain-text-splitters>=1.1,<2",
    "pandas==3.0.5",
    "pdfplumber==0.11.10",
    "pillow==12.3.0",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pymupdf==1.28.2",
    "pypdf==6.15.0",
    "pytesseract==0.3.13",
    "python-docx==1.2.0",
    "python-dotenv>=1.2,<2",
    "qdrant-client>=1.19,<2",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.62,<2",
    "structlog==26.1.0",
    "tabulate==0.10.0",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]
notebooks = [
    "nbconvert>=7.17,<8",
    "nbformat>=5.11,<6",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require the local Docker Compose services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
