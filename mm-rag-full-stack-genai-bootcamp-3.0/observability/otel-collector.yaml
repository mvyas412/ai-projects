extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  attributes/privacy:
    actions:
      - {key: authorization, action: delete}
      - {key: cookie, action: delete}
      - {key: db.statement, action: delete}
      - {key: exception.message, action: delete}
      - {key: exception.stacktrace, action: delete}
      - {key: http.request.body, action: delete}
      - {key: http.response.body, action: delete}
      - {key: messaging.message.body, action: delete}
      - {key: object_key, action: delete}
      - {key: prompt, action: delete}
      - {key: token, action: delete}
  batch:
    send_batch_size: 256
    timeout: 2s

exporters:
  otlphttp/lgtm:
    endpoint: http://lgtm:4318
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp/lgtm]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp/lgtm]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp/lgtm]
